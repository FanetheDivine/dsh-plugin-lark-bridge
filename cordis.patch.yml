# 用于 dsh plugin add：插件安装后作为组合层插入的 preset 行（id = 包名）。
# 本地可在 profile 的 cordis.patch.yml 里按 id 覆盖 config。
- insert:
    - id: dsh-plugin-lark-bridge
      name: dsh-plugin-lark-bridge
      config:
        # 飞书消息注入的目标工作区；必须是已存在的绝对路径。
        workspaceRoot: ''
        # 桥接会话标题。
        sessionTitle: '飞书'
        # 每次加载检测鉴权；失败时显示弹窗。
        authCheckOnStartup: true