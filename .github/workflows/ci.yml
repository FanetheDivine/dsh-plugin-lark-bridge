name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - '*'

jobs:
  check:
    name: Check (typecheck + lint + test:code + build + test:dist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Full check
        run: pnpm run full-check

  # 发布到 npm：tag 触发，使用 OIDC Trusted Publishing。
  publish:
    name: Publish to npm (trusted publishing)
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write   # npm OIDC 换取发布令牌 / 生成 provenance
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # trusted publishing（OIDC）要求 npm >= 11.5.1；沿用 runner 自带的 npm，避免与 check job 版本漂移
      - name: Check npm supports OIDC (>= 11.5.1)
        run: |
          npm --version
          node -e "const [major, minor] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && minor < 5)) { console.error('trusted publishing 需要 npm >= 11.5.1'); process.exit(1); }" "$(npm --version)"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      # 0.1.0 由维护者手工引导发布，tag 触发的发布检测到同版本后跳过
      - name: Check published version
        id: published
        run: node scripts/publish-guard.mjs >> "$GITHUB_OUTPUT"
      - name: Skip publish (version already on npm)
        if: steps.published.outputs.exists == 'true'
        run: echo "目标版本已在 npm，跳过发布"
      - name: Publish to npm
        if: steps.published.outputs.exists != 'true'
        run: npm publish
