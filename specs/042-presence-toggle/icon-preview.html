<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>在场状态图标候选</title>
<style>
  body { font: 14px system-ui, sans-serif; background: #f7f8fa; color: #1f2329; margin: 24px; }
  h2 { font-size: 15px; margin: 24px 0 4px; }
  p { margin: 0 0 8px; color: #646a73; }
  .row { display: flex; gap: 40px; align-items: flex-start; }
  .state { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .footer { display: flex; gap: 4px; align-items: center; padding: 6px 8px; background: #fff; border-radius: 10px; }
  .btn { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #646a73; }
  .btn.ref { color: #646a73; }
  .btn.red { color: #e5484d; }
  .btn.target { outline: 2px dashed #e5484d; outline-offset: 2px; }
  .btn.hover { background: color-mix(in srgb, currentColor 12%, transparent); }
  .on { color: #2ea043; }
  .off { color: #646a73; }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  small { color: #8f959e; }
</style>
</head>
<body>
<svg style="display:none">
  <symbol id="broom" viewBox="0 0 24 24"><path d="M19.5 4.5 13 11"/><path d="M12.6 11.4c-2.3.3-4.3 1.5-5.7 3.3l2.4 2.4c1.8-1.4 3-3.4 3.3-5.7z"/><path d="M6.9 14.7 3.5 20.5l5.8-3.4"/></symbol>
  <symbol id="restart" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 4.5v5h-5"/></symbol>
  <symbol id="monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4"/><path d="M8 20h8"/></symbol>
  <symbol id="phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></symbol>
  <symbol id="person" viewBox="0 0 24 24"><circle cx="10" cy="8" r="3.5"/><path d="M3.5 20c.8-3.6 3.4-5.5 6.5-5.5 1.4 0 2.6.4 3.6 1"/></symbol>
  <symbol id="monitor-only" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4"/><path d="M8 20h8"/></symbol>
</svg>

<h2>A：显示器 / 手机（推荐）</h2>
<p>图案直接对应回复渠道：在电脑旁走 GUI 正文，离开走飞书。</p>
<div class="row">
  <div class="state"><div class="footer"><span class="btn ref"><svg><use href="#broom"/></svg></span><span class="btn red"><svg><use href="#restart"/></svg></span><span class="btn target on"><svg><use href="#monitor"/></svg></span></div><small>在电脑旁（绿）</small></div>
  <div class="state"><div class="footer"><span class="btn ref"><svg><use href="#broom"/></svg></span><span class="btn red"><svg><use href="#restart"/></svg></span><span class="btn target off"><svg><use href="#phone"/></svg></span></div><small>离开（灰）</small></div>
  <div class="state"><div class="footer"><span class="btn target on hover"><svg><use href="#monitor"/></svg></span><span class="btn target off hover"><svg><use href="#phone"/></svg></span></div><small>悬停</small></div>
</div>

<h2>B：人像 + 状态点（类似 IM 在线状态）</h2>
<p>绿色实心点为在电脑旁，灰色空心点为离开。图案不变，只看圆点。</p>
<div class="row">
  <div class="state"><div class="footer"><span class="btn ref"><svg><use href="#broom"/></svg></span><span class="btn red"><svg><use href="#restart"/></svg></span><span class="btn target off"><svg viewBox="0 0 24 24"><use href="#person"/><circle cx="18" cy="17.5" r="3.2" fill="#2ea043" stroke="#2ea043"/></svg></span></div><small>在电脑旁</small></div>
  <div class="state"><div class="footer"><span class="btn ref"><svg><use href="#broom"/></svg></span><span class="btn red"><svg><use href="#restart"/></svg></span><span class="btn target off"><svg viewBox="0 0 24 24"><use href="#person"/><circle cx="18" cy="17.5" r="3"/></svg></span></div><small>离开</small></div>
</div>

<h2>C：显示器 + 角标</h2>
<p>同一个显示器，在电脑旁带绿色实心点，离开时屏幕变虚线。</p>
<div class="row">
  <div class="state"><div class="footer"><span class="btn ref"><svg><use href="#broom"/></svg></span><span class="btn red"><svg><use href="#restart"/></svg></span><span class="btn target off"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4"/><path d="M8 20h8"/><circle cx="19" cy="16.5" r="3" fill="#2ea043" stroke="#fff" stroke-width="1.5"/></svg></span></div><small>在电脑旁</small></div>
  <div class="state"><div class="footer"><span class="btn ref"><svg><use href="#broom"/></svg></span><span class="btn red"><svg><use href="#restart"/></svg></span><span class="btn target off"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2" stroke-dasharray="3 2.4"/><path d="M12 16v4"/><path d="M8 20h8"/></svg></span></div><small>离开</small></div>
</div>
</body>
</html>
